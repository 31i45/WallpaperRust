name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Format + Clippy + Test + Size
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --lib

      - name: Build release
        run: cargo build --release

      - name: Size check
        run: |
          $desktop = (Get-Item target/release/DesktopRust.exe).Length
          $lock = (Get-Item target/release/LockscreenRust.exe).Length
          Write-Host "DesktopRust: $desktop bytes ($([math]::Round($desktop/1024)) KB)"
          Write-Host "LockscreenRust: $lock bytes ($([math]::Round($lock/1024)) KB)"
          if ($desktop -gt 153600) { throw "DesktopRust exceeds 150 KB threshold: $desktop" }
          if ($lock -gt 163840) { throw "LockscreenRust exceeds 160 KB threshold: $lock" }
          Write-Host "Both executables within size limits."
